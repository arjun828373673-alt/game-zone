<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja Game</title>
    <style>
        body {
            background: #1e293b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 600px;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            background: #0f172a;
            border: 3px solid #38bdf8;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #game-over-screen {
            display: none;
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #ef4444;
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #16a34a;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">❤️❤️❤️</span></div>
    </div>

    <div style="position: relative; display: flex; justify-content: center; align-items: center;">
        <canvas id="fruitCanvas" width="600" height="400"></canvas>

        <div id="game-over-screen">
            <h1 style="color: #ef4444; margin-bottom: 5px;">GAME OVER</h1>
            <p>Your final score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("fruitCanvas");
        const ctx = canvas.getContext("2d");

        let fruits = [];
        let mouseTrail = [];
        let score = 0;
        let lives = 3;
        let gameOver = false;

        const fruitEmojie = ['🍎', '🍉', '🍌', '🍊', '🍒', '💣'];

        canvas.addEventListener("mousemove", function(event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            mouseTrail.push({ x: mouseX, y: mouseY, time: Date.now() });

            if (!gameOver) {
                checkSlice(mouseX, mouseY);
            }
        });

        class fruit {
            constructor() {
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = canvas.height + 20;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -(Math.random() * 4 + 11);
                this.gravity = 0.25;
                this.radius = 30;
                this.type = fruitEmojie[Math.floor(Math.random() * fruitEmojie.length)];
                this.sliced = false;
                this.isBomb = this.type === '💣';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
            }

            draw() {
                ctx.font = '40px serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type, this.x, this.y);
            }
        }

        function spawnFruits() {
            if (!gameOver && Math.random() < 0.03) {
                fruits.push(new fruit());
            }
        }

        function checkSlice(mouseX, mouseY) {
            fruits.forEach((fruit, index) => {
                if (!fruit.sliced) {
                    const dist = Math.hypot(mouseX - fruit.x, mouseY - fruit.y);
                    if (dist < fruit.radius) {
                        fruit.sliced = true;

                        if (fruit.isBomb) {
                            endGame();
                        } else {
                            score += 10;
                            document.getElementById("score").innerText = score;
                            fruits.splice(index, 1);
                        }
                    }
                }
            });
        }

        function drawBlade() {
            const now = Date.now();
            mouseTrail = mouseTrail.filter(point => now - point.time < 150);

            if (mouseTrail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(mouseTrail[0].x, mouseTrail[0].y);
                for (let i = 1; i < mouseTrail.length; i++) {
                    ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
                }
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        function updateGame() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            spawnFruits();

            for (let i = fruits.length - 1; i >= 0; i--) {
                const f = fruits[i];
                f.update();
                f.draw();

                if (f.y > canvas.height + 50) {
                    if (!f.sliced && !f.isBomb) {
                        lives--;
                        updateLivesUI();
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    fruits.splice(i, 1);
                }
            }

            drawBlade();
            requestAnimationFrame(updateGame);
        }

        function updateLivesUI() {
            const livesElement = document.getElementById("lives");
            livesElement.innerHTML = '❤️'.repeat(lives);
        }

        function endGame() {
            gameOver = true;
            document.getElementById("game-over-screen").style.display = "block";
            document.getElementById("final-score").innerText = score;
        }

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            fruits = [];
            mouseTrail = [];
            document.getElementById("score").innerText = score;
            updateLivesUI();
            document.getElementById("game-over-screen").style.display = "none";
            updateGame();
        }

        updateGame();
    </script>
</body>
</html>
