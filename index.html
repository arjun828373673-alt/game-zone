<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja Game</title>
    <style>
        :root {
            --bg-dark: #1e293b;
            --canvas-bg: #0f172a;
            --border-color: #38bdf8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --success-hover: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #ui {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            font-size: 1.25rem;
            margin-bottom: 12px;
            font-weight: 700;
            padding: 0 10px;
        }

        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: var(--canvas-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }

        .game-over-screen {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--danger-color);
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
        }

        .game-over-title {
            color: var(--danger-color);
            margin-bottom: 8px;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .restart-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background: var(--success-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 15px;
            transition: background 0.2s ease;
        }

        .restart-btn:hover {
            background: var(--success-hover);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">❤️❤️❤️</span></div>
    </header>

    <main class="canvas-container">
        <canvas id="fruitCanvas" width="600" height="400"></canvas>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <h1 class="game-over-title">GAME OVER</h1>
            <p>Your final score: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="restart-btn">Play Again 🔄</button>
        </div>
    </main>

    <script>
        const FRUIT_EMOJIS = ['🍎', '🍉', '🍌', '🍊', '🍒'];
        const BOMB_EMOJI = '💣';
        const TRAIL_LIFESPAN_MS = 150;

        const canvas = document.getElementById('fruitCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');
        
        let gameState = {
            score: 0,
            lives: 3,
            isGameOver: false,
            fruits: [],
            particles: [],
            mouseTrail: []
        };

        class Fruit {
            constructor() {
                this.x = Math.random() * (canvas.width - 120) + 60;
                this.y = canvas.height + 30;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -(Math.random() * 4 + 11);
                this.gravity = 0.25;
                this.radius = 30;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.1;
                
                this.isBomb = Math.random() < 0.2; // 20% chance for a bomb
                this.type = this.isBomb ? BOMB_EMOJI : FRUIT_EMOJIS[Math.floor(Math.random() * FRUIT_EMOJIS.length)];
                this.sliced = false;
                this.markedForRemoval = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
            }

            draw(context) {
                context.save();
                context.translate(this.x, this.y);
                context.rotate(this.rotation);
                context.font = '40px serif';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(this.type, 0, 0);
                context.restore();
            }
        }

        class JuiceParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.radius = Math.random() * 4 + 2;
                this.alpha = 1;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.04;
            }

            draw(context) {
                context.save();
                context.globalAlpha = Math.max(0, this.alpha);
                context.fillStyle = this.color;
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.fill();
                context.restore();
            }
        }

        function getCanvasCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handlePointerMove(event) {
            if (gameState.isGameOver) return;

            const pos = getCanvasCoordinates(event);
            gameState.mouseTrail.push({ x: pos.x, y: pos.y, time: Date.now() });
            checkSlice(pos.x, pos.y);
        }

        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handlePointerMove(e);
        }, { passive: false });

        restartBtn.addEventListener('click', resetGame);
        function createSplatFX(x, y) {
            const colors = ['#f87171', '#facc15', '#4ade80', '#fb923c'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 8; i++) {
                gameState.particles.push(new JuiceParticle(x, y, color));
            }
        }

        function spawnFruits() {
            if (!gameState.isGameOver && Math.random() < 0.035) {
                gameState.fruits.push(new Fruit());
            }
        }

        function checkSlice(pointerX, pointerY) {
            gameState.fruits.forEach(fruit => {
                if (!fruit.sliced) {
                    const distance = Math.hypot(pointerX - fruit.x, pointerY - fruit.y);
                    if (distance < fruit.radius) {
                        fruit.sliced = true;
                        fruit.markedForRemoval = true;

                        if (fruit.isBomb) {
                            triggerGameOver();
                        } else {
                            gameState.score += 10;
                            scoreEl.textContent = gameState.score;
                            createSplatFX(fruit.x, fruit.y);
                        }
                    }
                }
            });
        }

        function drawBladeTrail() {
            const now = Date.now();
            gameState.mouseTrail = gameState.mouseTrail.filter(point => now - point.time < TRAIL_LIFESPAN_MS);

            if (gameState.mouseTrail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(gameState.mouseTrail[0].x, gameState.mouseTrail[0].y);
                for (let i = 1; i < gameState.mouseTrail.length; i++) {
                    ctx.lineTo(gameState.mouseTrail[i].x, gameState.mouseTrail[i].y);
                }
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }

        function updateLivesDisplay() {
            livesEl.textContent = '❤️'.repeat(Math.max(0, gameState.lives));
        }

        function triggerGameOver() {
            gameState.isGameOver = true;
            finalScoreEl.textContent = gameState.score;
            gameOverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            if (gameState.isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            spawnFruits();

            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const particle = gameState.particles[i];
                particle.update();
                particle.draw(ctx);
                if (particle.alpha <= 0) {
                    gameState.particles.splice(i, 1);
                }

            for (let i = gameState.fruits.length - 1; i >= 0; i--) {
                const fruit = gameState.fruits[i];
                fruit.update();
                fruit.draw(ctx);

                if (fruit.y > canvas.height + 50) {
                    if (!fruit.sliced && !fruit.isBomb) {
                        gameState.lives--;
                        updateLivesDisplay();
                        if (gameState.lives <= 0) {
                            triggerGameOver();
                        }
                    }
                    fruit.markedForRemoval = true;
                }

                if (fruit.markedForRemoval) {
                    gameState.fruits.splice(i, 1);
                }
            }

            drawBladeTrail();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            gameState.score = 0;
            gameState.lives = 3;
            gameState.isGameOver = false;
            gameState.fruits = [];
            gameState.particles = [];
            gameState.mouseTrail = [];

            scoreEl.textContent = '0';
            updateLivesDisplay();
            gameOverScreen.classList.add('hidden');
            
            gameLoop();
        }

        gameLoop();
    </script>
</body>
</html>
