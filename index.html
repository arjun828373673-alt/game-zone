<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>game</title>
   <style>
    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
        background-color:#2c3e50;
    }
    canvas{
        border:5px solid white;
        background-color:#0f0f0f;
    }
   </style>
   </head>
   <body>
    <canvas id="fruitCanvas" width="600" height="400"></canvas>
    <script>
        // Get the canvas element and its context
        const canvas = document.getElementById("fruitCanvas");
        const ctx = canvas.getContext("2d");
        // Initialize variables for the fruit's position, velocity, and gravity
        let x = 0;
        let y = 350;
        let velocityX = 2;
        let velocityY = -12;
        let gravity = 0.3;
        let mouseX = 0;
        let mouseY = 0
        // Add an event listener to track the mouse position
        canvas.addEventListener("mousemove", function(event) {
            const rect = canvas.getBoundingClientRect();
            mouseX = event.clientX - rect.left;
            mouseY = event.clientY - rect.top;
        });
        // Function to animate the fruit
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.arc(x, y, 50, 0, Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();
            // Calculate the distance between the mouse and the fruit
            let dx = mouseX - x;
            let dy = mouseY - y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            // If the mouse is close enough to the fruit, reset its position and velocity
            if (distance < 50) {
                console.log("slice1");
                x = 0;
                y = 350;
                velocityY = -12;
            }
            // If the fruit goes off the canvas, reset its position and velocity
             if(x > 600 || y > 450) {
                x = 0;
                y = 350;
                velocityY = -12;
            }
            // Update the fruit's position and velocity
            x = x + velocityX;
            y = y + velocityY;
            velocityY = velocityY + gravity;
            requestAnimationFrame(animate);
        }
        // Start the animation
         animate();

        </script>
   </body>
</html>
